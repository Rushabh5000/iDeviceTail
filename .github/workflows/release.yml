name: Release

# Publishes the `idevicetail` package to PyPI when you push a version tag
# (e.g. `git tag v0.1.0 && git push --tags`).
#
# Uses PyPI Trusted Publishing (OIDC) — NO API token / secret needed.
# One-time setup on PyPI:
#   https://pypi.org/manage/account/publishing/  ->  Add a pending publisher
#     PyPI project name: idevicetail
#     Owner:            Rushabh5000
#     Repository:       idevicetail
#     Workflow name:    release.yml
#     Environment:      pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
